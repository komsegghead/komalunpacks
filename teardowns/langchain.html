<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LangChain — Day 07 · Komal Unpacks</title>

  <!-- Open Graph / LinkedIn preview -->
  <meta property="og:title" content="LangChain — The Plumbing of AI · Komal Unpacks"/>
  <meta property="og:description" content="Day 07 of #HowIAI — A PM teardown of LangChain: 222M downloads, mass criticism, and why the most popular AI framework is also the most debated."/>
  <meta property="og:url" content="https://komalunpacks.com/teardowns/langchain.html"/>
  <meta property="og:type" content="article"/>
  <meta name="twitter:card" content="summary_large_image"/>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:        #FFFDF8;
      --sunshine:     #FEF6DC;
      --plum:         #6B3D7A;
      --plum-light:   #9B6DAA;
      --plum-pale:    rgba(107,61,122,0.10);
      --plum-pale2:   rgba(107,61,122,0.06);
      --plum-deep:    #3D1F50;
      --burgundy:     #8B2252;
      --navy:         #1B2A4A;
      --text:         #2A1A35;
      --text-muted:   #7A6080;
      --border:       rgba(107,61,122,0.12);
      --border-mid:   rgba(107,61,122,0.20);
      --green:        #2E7D4F;
      --green-light:  #E8F5EE;
      --red:          #8B2A2A;
      --red-light:    #FAEAEA;
      --orange:       #B05C00;
      --orange-light: #FFF3E0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.25rem 4rem;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,253,248,0.93);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem; font-weight: 400; color: var(--plum);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-size: 0.8rem; font-weight: 400; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      text-decoration: none; transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--plum); }

    /* ── HERO ── */
    .hero {
      padding-top: 80px;
      background: var(--navy);
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 70% 50%, rgba(107,61,122,0.35) 0%, transparent 65%),
                  radial-gradient(ellipse at 20% 80%, rgba(139,34,82,0.20) 0%, transparent 55%);
    }
    .hero-inner {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto;
      padding: 4rem 2rem 3.5rem;
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 100px;
      padding: 0.35rem 1rem;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.65);
      margin-bottom: 1.5rem;
    }
    .hero-eyebrow span { color: rgba(254,246,220,0.9); }
    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 6vw, 4rem);
      font-weight: 600; color: #fff;
      line-height: 1.1; margin-bottom: 0.4rem;
    }
    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-style: italic; font-weight: 300;
      color: rgba(255,255,255,0.55);
      margin-bottom: 1.2rem;
    }
    .hero-tagline {
      font-size: 0.95rem; color: rgba(255,255,255,0.70);
      max-width: 560px; line-height: 1.6; margin-bottom: 1.8rem;
    }
    .hero-meta {
      display: flex; flex-wrap: wrap; gap: 1.2rem;
      font-size: 0.78rem; color: rgba(255,255,255,0.45);
    }
    .hero-meta span { display: flex; align-items: center; gap: 0.35rem; }

    /* ── MAIN CONTENT ── */
    .page-body {
      max-width: 860px; margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--plum); margin-bottom: 0.6rem;
      padding-bottom: 0.5rem;
      border-bottom: 1.5px solid var(--plum-pale);
      margin-top: 3rem;
    }
    .section-label:first-child { margin-top: 0; }

    /* ── INTRO ── */
    .intro-text {
      font-size: 1.05rem; line-height: 1.75;
      color: var(--text); margin-bottom: 1rem;
    }
    .intro-note {
      font-size: 0.875rem; line-height: 1.65;
      color: var(--text-muted);
      background: var(--sunshine);
      border-left: 3px solid var(--plum);
      padding: 0.85rem 1.1rem;
      border-radius: 0 6px 6px 0;
    }

    /* ── PERSONAS GRID ── */
    .personas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem; margin-top: 0.75rem;
    }
    .persona-card {
      background: var(--white);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      padding: 1.1rem 1.2rem;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .persona-card:hover {
      box-shadow: 0 4px 16px rgba(107,61,122,0.10);
      border-color: var(--plum-light);
    }
    .persona-icon { font-size: 1.6rem; margin-bottom: 0.5rem; }
    .persona-title {
      font-weight: 500; font-size: 0.9rem;
      color: var(--plum-deep); margin-bottom: 0.4rem;
    }
    .persona-desc {
      font-size: 0.82rem; color: var(--text-muted); line-height: 1.55;
    }
    .persona-tag {
      display: inline-block; margin-top: 0.6rem;
      font-size: 0.68rem; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 0.2rem 0.6rem;
      border-radius: 100px;
      background: var(--plum-pale); color: var(--plum);
    }
    .personas-group-label {
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
      margin: 1rem 0 0.5rem;
    }

    /* ── JTBD ── */
    .jtbd-list {
      list-style: none; display: flex; flex-direction: column; gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .jtbd-list li {
      font-size: 0.9rem; line-height: 1.55; color: var(--text);
      padding: 0.7rem 1rem 0.7rem 1.5rem;
      background: var(--plum-pale2);
      border-left: 2.5px solid var(--plum-light);
      border-radius: 0 6px 6px 0;
      position: relative;
    }

    /* ── WHAT WORKS ── */
    .works-item {
      margin-top: 1rem;
      border: 1px solid var(--green);
      border-radius: 10px; overflow: hidden;
    }
    .works-header {
      background: var(--green-light);
      padding: 0.75rem 1.1rem;
      font-size: 0.88rem; font-weight: 500; color: var(--green);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .works-points {
      list-style: none; padding: 0.75rem 1.1rem;
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .works-points li {
      font-size: 0.85rem; line-height: 1.55; color: var(--text);
      padding-left: 1rem; position: relative;
    }
    .works-points li::before {
      content: '→'; position: absolute; left: 0;
      color: var(--green); font-size: 0.8rem;
    }
    .works-points li.italic-point { font-style: italic; color: var(--text-muted); }

    /* ── WHAT DOESN'T WORK ── */
    .pain-item {
      margin-top: 1rem;
      border: 1px solid var(--red);
      border-radius: 10px; overflow: hidden;
    }
    .pain-title {
      background: var(--red-light);
      padding: 0.75rem 1.1rem;
      font-size: 0.88rem; font-weight: 500; color: var(--red);
    }
    .pain-desc {
      padding: 0.75rem 1.1rem;
      font-size: 0.85rem; line-height: 1.6; color: var(--text);
    }

    /* ── OPPORTUNITIES ── */
    .opp-item {
      display: flex; gap: 1rem; align-items: flex-start;
      margin-top: 1rem;
      background: var(--white);
      border: 1px solid var(--border-mid);
      border-left: 3px solid var(--plum);
      border-radius: 0 10px 10px 0;
      padding: 1rem 1.2rem;
      transition: box-shadow 0.2s;
    }
    .opp-item:hover { box-shadow: 0 3px 14px rgba(107,61,122,0.09); }
    .opp-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem; font-weight: 600;
      color: var(--plum); line-height: 1;
      min-width: 2.5rem; text-align: center; padding-top: 0.1rem;
    }
    .opp-title {
      font-size: 0.9rem; font-weight: 500;
      color: var(--plum-deep); margin-bottom: 0.35rem;
    }
    .opp-desc {
      font-size: 0.84rem; line-height: 1.6; color: var(--text-muted);
    }

    /* ── METRICS ── */
    .metrics-category {
      margin-top: 1.2rem;
      border: 1px solid var(--border-mid);
      border-radius: 10px; overflow: hidden;
    }
    .metrics-category-title {
      background: var(--plum-pale);
      padding: 0.65rem 1.1rem;
      font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--plum-deep);
    }
    .metric-row {
      padding: 0.8rem 1.1rem;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 0.25rem;
    }
    .metric-row:first-of-type { border-top: none; }
    .metric-name {
      font-size: 0.88rem; font-weight: 500; color: var(--text);
    }
    .metric-desc {
      font-size: 0.82rem; line-height: 1.55; color: var(--text-muted);
    }

    /* ── PM TAKEAWAY ── */
    .pm-take {
      margin-top: 3rem;
      background: var(--navy);
      border-radius: 12px;
      padding: 2rem 2.2rem;
      position: relative; overflow: hidden;
    }
    .pm-take::before {
      content: '';
      position: absolute; top: 0; right: 0;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(107,61,122,0.4) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(50%, -50%);
    }
    .pm-take-label {
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
      margin-bottom: 0.75rem;
    }
    .pm-take-text {
      font-size: 0.95rem; line-height: 1.75;
      color: rgba(255,255,255,0.88);
      position: relative; z-index: 1;
    }

    /* ── TEARDOWN NAV ── */
    .teardown-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 3rem; padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .teardown-nav a {
      font-size: 0.82rem; font-weight: 500;
      color: var(--plum); text-decoration: none;
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .teardown-nav a:hover {
      background: var(--plum-pale); border-color: var(--plum-light);
    }
    .teardown-nav span { display: block; min-width: 80px; }

    /* ── FOOTER ── */
    footer {
      background: var(--navy); color: rgba(255,255,255,0.45);
      text-align: center; font-size: 0.78rem;
      padding: 2rem; margin-top: 0;
    }
    footer a { color: rgba(255,255,255,0.6); text-decoration: none; }
    footer a:hover { color: #fff; }

    /* ── LOADING ── */
    #loading {
      text-align: center; padding: 4rem 2rem;
      color: var(--text-muted); font-size: 0.9rem;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .hero-inner { padding: 3rem 1.5rem 2.5rem; }
      .page-body { padding: 2rem 1.5rem 4rem; }
      .personas-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" href="/">Komal Unpacks</a>
    <ul class="nav-links">
      <li><a href="/#teardowns">Teardowns</a></li>
      <li><a href="/#case-studies">Case Studies</a></li>
      <li><a href="/#about">About</a></li>
    </ul>
  </nav>

  <!-- HERO (populated by JS) -->
  <div class="hero" id="hero">
    <div class="hero-inner" id="hero-inner">
      <div id="loading">Loading teardown…</div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="page-body">
    <div id="main-content"></div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>Part of the <strong>#HowIAI</strong> series · <a href="https://komalunpacks.com">komalunpacks.com</a></p>
    <p style="margin-top:0.4rem;">Built by Komal Sikka · PM · Barclays</p>
  </footer>

  <script>
    const JSON_URL = 'https://raw.githubusercontent.com/komsegghead/komalunpacks/main/teardowns/langchain.json';

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    async function loadTeardown() {
      try {
        const res = await fetch(JSON_URL);
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        renderHero(data);
        renderMain(data);
      } catch(e) {
        document.getElementById('loading').textContent = 'Could not load teardown data.';
        console.error(e);
      }
    }

    function renderHero(d) {
      const m = d.meta || {};
      document.title = `${m.title} — Day ${m.day} · Komal Unpacks`;
      document.getElementById('hero-inner').innerHTML = `
        <div class="hero-eyebrow">
          How I AI Series · <span>Day ${String(m.day).padStart(2,'0')}</span>
        </div>
        <h1 class="hero-title">${m.title}</h1>
        <p class="hero-subtitle">${m.subtitle || ''}</p>
        <p class="hero-tagline">${m.tagline || ''}</p>
        <div class="hero-meta">
          ${m.published_date ? `<span>📅 ${formatDate(m.published_date)}</span>` : ''}
          ${m.read_time      ? `<span>⏱ ${m.read_time}</span>` : ''}
          <span>🔍 PM Lens Teardown</span>
          ${m.category       ? `<span>🏷 ${m.category}</span>` : ''}
        </div>
      `;
    }

    function renderMain(d) {
      let n = 1;
      const sn = () => String(n++).padStart(2,'0');
      let html = '';

      /* 01 — INTRO */
      html += `<p class="section-label">${sn()} — The Product</p>`;
      html += `<p class="intro-text">${d.intro.summary}</p>`;
      if (d.intro.note) html += `<p class="intro-note">${d.intro.note}</p>`;

      /* 02 — PERSONAS */
      html += `<p class="section-label">${sn()} — User Personas — Who It's For</p>`;
      const primary   = (d.personas || []).filter(p => p.segment === 'primary');
      const secondary = (d.personas || []).filter(p => p.segment === 'secondary');

      if (primary.length) {
        html += `<p class="personas-group-label">Primary Segments</p>`;
        html += `<div class="personas-grid">`;
        primary.forEach(p => {
          html += `<div class="persona-card">
            <div class="persona-icon">${p.icon}</div>
            <div class="persona-title">${p.title}</div>
            <div class="persona-desc">${p.description}</div>
          </div>`;
        });
        html += `</div>`;
      }

      if (secondary.length) {
        html += `<p class="personas-group-label" style="margin-top:1.2rem;">Secondary Segments</p>`;
        html += `<div class="personas-grid">`;
        secondary.forEach(p => {
          html += `<div class="persona-card">
            <div class="persona-icon">${p.icon}</div>
            <div class="persona-title">${p.title}</div>
            <div class="persona-desc">${p.description}</div>
          </div>`;
        });
        html += `</div>`;
      }

      /* 03 — JTBD */
      html += `<p class="section-label">${sn()} — Jobs to Be Done</p>`;
      html += `<ul class="jtbd-list">`;
      (d.jtbd || []).forEach(j => { html += `<li>${j}</li>`; });
      html += `</ul>`;

      /* 04 — WHAT WORKS */
      if (d.what_works && d.what_works.length) {
        html += `<p class="section-label">${sn()} — What Works Well</p>`;
        d.what_works.forEach(w => {
          const lastIdx = w.points.length - 1;
          html += `<div class="works-item">
            <div class="works-header">✓ ${w.title}</div>
            <ul class="works-points">`;
          w.points.forEach((pt, i) => {
            const cls = (i === lastIdx && w.points.length > 1) ? 'italic-point' : '';
            html += `<li class="${cls}">${pt}</li>`;
          });
          html += `</ul></div>`;
        });
      }

      /* 05 — WHAT DOESN'T WORK */
      if (d.what_doesnt_work && d.what_doesnt_work.length) {
        html += `<p class="section-label">${sn()} — What Doesn't Work Well</p>`;
        d.what_doesnt_work.forEach(w => {
          html += `<div class="pain-item">
            <div class="pain-title">${w.title}</div>
            <div class="pain-desc">${w.description}</div>
          </div>`;
        });
      }

      /* 06 — OPPORTUNITIES */
      if (d.opportunities && d.opportunities.length) {
        html += `<p class="section-label">${sn()} — What I'd Do Differently</p>`;
        d.opportunities.forEach(o => {
          html += `<div class="opp-item">
            <div class="opp-num">${o.number}</div>
            <div>
              <div class="opp-title">${o.title}</div>
              <div class="opp-desc">${o.description}</div>
            </div>
          </div>`;
        });
      }

      /* 07 — METRICS */
      if (d.metrics && d.metrics.length) {
        html += `<p class="section-label">${sn()} — Product Metrics</p>`;
        d.metrics.forEach(cat => {
          html += `<div class="metrics-category">
            <div class="metrics-category-title">${cat.category}</div>`;
          (cat.items || []).forEach(item => {
            html += `<div class="metric-row">
              <div class="metric-name">${item.name}</div>
              <div class="metric-desc">${item.description}</div>
            </div>`;
          });
          html += `</div>`;
        });
      }

      /* PM TAKEAWAY */
      if (d.pm_take) {
        html += `<div class="pm-take">
          <div class="pm-take-label">PM's Takeaway</div>
          <div class="pm-take-text">${d.pm_take}</div>
        </div>`;
      }

      /* TEARDOWN NAV */
      const prev = d.prev || d.meta?.prev;
      const next = d.next || d.meta?.next;
      if (prev || next) {
        html += `<div class="teardown-nav">`;
        html += prev ? `<a href="${prev.link}">← ${prev.label}</a>` : `<span></span>`;
        html += next ? `<a href="${next.link}">${next.label} →</a>` : `<span></span>`;
        html += `</div>`;
      }

      document.getElementById('main-content').innerHTML = html;
    }

    loadTeardown();
  </script>
</body>
</html>
